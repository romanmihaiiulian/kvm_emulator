<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="@COLOR1@"/>
      <stop offset="1" stop-color="@COLOR2@"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="30" y="84" font-family="DejaVu Sans" font-weight="bold" font-size="46" fill="#ffffff">@LABEL@</text>
  <text x="1250" y="84" text-anchor="end" font-family="DejaVu Sans" font-size="26" fill="#ffffff">Port @PORT@ · @TITLE@</text>
</svg>
